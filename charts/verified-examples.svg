<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Verified training examples: 403 before AMD, 7,193 after pass 1, 9,749 after pass 2">
  <rect width="720" height="380" rx="12" fill="#fcfcfb"/>
  <text x="32" y="44" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#0b0b0b">Verified training examples from the teacher</text>
  <text x="32" y="70" font-family="Inter, Arial, sans-serif" font-size="14" fill="#5f5e5a">Each example checked in the CAD engine before it is kept · cumulative</text>
  <!-- scale: 0..10,000 -> y 300..100 (200 px) -->
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#898781">
    <line x1="88" y1="300" x2="688" y2="300" stroke="#c9c8c1" stroke-width="1"/>
    <line x1="88" y1="200" x2="688" y2="200" stroke="#e1e0d9" stroke-width="1"/>
    <line x1="88" y1="100" x2="688" y2="100" stroke="#e1e0d9" stroke-width="1"/>
    <text x="76" y="304" text-anchor="end">0</text>
    <text x="76" y="204" text-anchor="end">5,000</text>
    <text x="76" y="104" text-anchor="end">10,000</text>
  </g>
  <!-- 403 -> 8.1 ; 7193 -> 143.9 ; 9749 -> 195.0 -->
  <path d="M148 300 V295.9 a4 4 0 0 1 4 -4 H236 a4 4 0 0 1 4 4 V300 Z" fill="#2a78d6"/>
  <path d="M338 300 V160.1 a4 4 0 0 1 4 -4 H426 a4 4 0 0 1 4 4 V300 Z" fill="#2a78d6"/>
  <path d="M528 300 V109 a4 4 0 0 1 4 -4 H616 a4 4 0 0 1 4 4 V300 Z" fill="#2a78d6"/>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <text x="194" y="280" font-size="22" font-weight="600" fill="#0b0b0b">403</text>
    <text x="384" y="144" font-size="22" font-weight="600" fill="#0b0b0b">7,193</text>
    <text x="574" y="93" font-size="22" font-weight="600" fill="#0b0b0b">9,749</text>
    <text x="194" y="326" font-size="14" fill="#0b0b0b">Before AMD</text>
    <text x="384" y="326" font-size="14" fill="#0b0b0b">After pass 1</text>
    <text x="384" y="346" font-size="13" fill="#5f5e5a">~16 h on one MI300X</text>
    <text x="574" y="326" font-size="14" fill="#0b0b0b">After pass 2</text>
    <text x="574" y="346" font-size="13" fill="#5f5e5a">~17 h on one MI300X</text>
  </g>
</svg>
